# Render blueprint for the CityCart API.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
# Render creates the service from this file; you only fill in the marked
# secrets in the dashboard (sync: false means "ask at deploy time").
#
# The client deploys separately on Vercel (framework auto-detected, SPA
# routes in client/vercel.json). After both are live, set CLIENT_URL on this
# service and RENDER_API_URL in Vercel; leave VITE_API_URL empty there so the
# browser calls the Vercel domain and the auth cookie stays first-party.

services:
  - type: web
    name: citycart-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false # e.g. https://citycart.vercel.app
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false # long random string — required
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STAFF_SESSION_HOURS
        value: 8
      - key: TERMINATION_GRACE_HOURS
        value: 24
      # Online payments stay OFF until a real gateway is configured (docs/10 §29). Never set PAYMENT_PROVIDER=mock in production.
      - key: PAYMENT_PROVIDER
        value: none
      - key: ONLINE_PAYMENT_HOLD_MINUTES
        value: 30
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # optional; without them image upload falls back to links
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Transactional email over Brevo's HTTPS API (Render free blocks SMTP).
      # Without these, verification/reset links cannot be delivered in production.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # a sender address verified in Brevo
      - key: EMAIL_FROM_NAME
        value: CityCart
      - key: EMAIL_VERIFY_TTL_HOURS
        value: 24
      - key: PASSWORD_RESET_TTL_MINUTES
        value: 60
