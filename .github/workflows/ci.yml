# CityCart CI/CD
#
# Runs on every push to main and every pull request:
#   - server: lint + full unit suite
#   - client: lint + production build
#   - apps: the four Flutter apps (shopper, staff, delivery, business) —
#           each analysed and unit tested on its own
#   - integration: the real-database test suite (transactions, concurrency)
#
# Deployment (Vercel for the client, Render for the server) can be attached
# to this workflow later via environment secrets — see docs/17-deployment.md.
# Until then, this file is the CI gate: a red run blocks a merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Unit tests
        working-directory: server
        run: npm test

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Production build
        working-directory: client
        run: npm run build

  apps:
    name: Apps — ${{ matrix.app }} (analyze & tests)
    runs-on: ubuntu-latest
    strategy:
      # One broken app should not hide the state of the other three.
      fail-fast: false
      matrix:
        app: [shopper, staff, delivery, business]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose. The apps target Flutter 3.47.9 / Dart 3.13.7 and
      # their lockfiles were resolved with it; following `stable` turned main
      # red the day 3.50.0 shipped. Bump this number only after running
      # `flutter analyze` and `flutter test` in every app with the new SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

  integration:
    name: Server — integration tests (real MongoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # The suite spins up an in-memory MongoDB replica set itself
      # (mongodb-memory-server), which is what makes the transactional
      # checkout/order flows testable in CI without provisioning a database.
      - name: Integration tests
        working-directory: server
        run: npm run test:integration

  deploy:
    name: Deploy — trigger Render & Vercel (main only, after CI)
    needs: [server, client, apps, integration]
    # Deploys only from pushes to main, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK"

      - name: Trigger Vercel deploy (client)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK"

      # Each step skips itself silently when its secret is not configured —
      # add the secrets (Settings → Secrets and variables → Actions) and the
      # steps start firing. While a platform's own Git auto-deploy is still
      # on, disable it in that dashboard once this job is confirmed working,
      # so CI becomes the only thing that can trigger a deployment.
